name: "[STEP6] Dual DRM 통합 빌드 (ALL platforms 4.4.302, DSM 7.4)"

# 10 플랫폼 × DSM 7.4 = 10 빌드 매트릭스 (7.2/7.3 은 step6-dual-drm-all-platforms-44302.yml 전용)
# DSM 7.4 는 커널 버전 표기는 동일 4.4.302 이나, 일부 플랫폼(apollolake/broadwell)의
# syno-compiler 이미지 /opt/platforms 매니페스트가 실제와 다르게 표기된 전례가 있고,
# KLIB_BUILD 의 Module.symvers export 심볼셋이 7.2/7.3과 달라 Unknown symbol 이슈가
# 별도로 발생 중 — 원인 조사/수정을 7.2/7.3 과 격리하기 위해 이 워크플로우로 분리.
# 참고: dsm74_platform_manifest_kernel_mismatch, epyc7003ntb_dsm74_scope_and_build 메모리.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "빌드할 플랫폼 목록 (공백 구분, 빈값=전체)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.4", platform: geminilake }
          - { version: "7.4", platform: apollolake }
          - { version: "7.4", platform: broadwellnk }
          - { version: "7.4", platform: broadwell }
          - { version: "7.4", platform: broadwellnkv2 }
          - { version: "7.4", platform: broadwellntbap }
          - { version: "7.4", platform: denverton }
          - { version: "7.4", platform: purley }
          - { version: "7.4", platform: r1000 }
          - { version: "7.4", platform: v1000 }

    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Cache toolkit tarballs
        uses: actions/cache@v4
        with:
          path: |
            ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
            ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          key: toolkit-${{ matrix.platform }}-${{ matrix.version }}

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          if [ -f "$env_tarball" ]; then echo "[cache] $env_tarball"; else
            echo "[download] $env_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          fi
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          if [ -f "$dev_tarball" ]; then echo "[cache] $dev_tarball"; else
            echo "[download] $dev_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          fi
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      - name: "[DSM 7.4] 실제 커널 버전 실측 (매니페스트 오표기 대비)"
        run: |
          KVER_FILE=$(find ksrc -path "*include/config/kernel.release" | head -1)
          if [ -n "$KVER_FILE" ]; then
            echo "[${{ matrix.platform }}-7.4] kernel.release = $(cat "$KVER_FILE")"
          else
            echo "[WARN] kernel.release 파일을 찾지 못함 — 아래 Makefile 로 대체 확인"
            find ksrc -maxdepth 6 -name Makefile -path "*build*" -exec head -5 {} \; 2>/dev/null | head -20
          fi

      - name: "Build (Dual DRM: i915 + amdgpu)"
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KBUILD_MODPOST_WARN=1
          export OOT_ROOT=$PWD

          echo "=== [${{ matrix.platform }}-${{ matrix.version }}] host KLIB DRM .config ==="
          grep -E '^CONFIG_(DRM|I915|AMDGPU|TTM|DRM_SCHED)' "$KLIB_BUILD/.config" 2>/dev/null || echo "(없음)"

          export OOT_KCPPFLAGS="\
            -I$OOT_ROOT/compat/backport-include \
            -I$OOT_ROOT/include \
            -I$OOT_ROOT/include/uapi \
            -I$OOT_ROOT/compat \
            -include $OOT_ROOT/compat/drm_compat.h \
            -include $OOT_ROOT/compat/kcl_compat.h"

          # geminilake/apollolake host 는 hdmi/drm_mipi_dsi/sync_file/interval_tree/
          # intel_gtt 가 이미 빌트인(실기 /proc/kallsyms 확인) — 우리가 또 만들면
          # "invalid module format"(심볼 중복)으로 insmod 자체가 실패.
          # IN_KERNEL 가드로 스킵(host 위임), intel-gtt(AGP_INTEL)는 아예 빌드 안 함.
          EXTRA_CONFIG=""
          AGP_CONFIG="CONFIG_AGP_INTEL=m"
          case "${{ matrix.platform }}" in
            geminilake|apollolake)
              EXTRA_CONFIG="CONFIG_DRM_SYNC_FILE_IN_KERNEL=y CONFIG_INTERVAL_TREE_IN_KERNEL=y"
              AGP_CONFIG="" ;;
          esac

          make -C "$KLIB_BUILD" M="$OOT_ROOT" \
            CONFIG_DRM=m CONFIG_DRM_KMS_HELPER=m \
            CONFIG_DRM_I915=m CONFIG_DRM_I915_USERPTR=y \
            CONFIG_DRM_TTM=m CONFIG_DRM_SCHED=m \
            CONFIG_DRM_AMDGPU=m \
            $AGP_CONFIG \
            CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=m \
            $EXTRA_CONFIG \
            KCPPFLAGS="$OOT_KCPPFLAGS" \
            modules 2>&1 | tee /tmp/build.log || true

          # 디버그 심볼 제거
          find "$OOT_ROOT" -name "*.ko" | while read ko; do
            ${CROSS_COMPILE}strip --strip-debug "$ko"
          done

          echo ""
          echo "################ 빌드 결과 요약 [${{ matrix.platform }}-${{ matrix.version }}] ################"
          echo "=== [1] 에러 총수 ==="
          grep -cE ': error:' /tmp/build.log || echo 0
          echo "=== [2] 에러난 소스 파일별 건수 ==="
          grep -oE '[a-zA-Z0-9_/.-]+\.[ch]:[0-9]+: error' /tmp/build.log | sed -E 's/:[0-9]+: error//' | sort | uniq -c | sort -rn | head -30
          echo "=== [3] 에러 메시지 유형별 ==="
          grep -oE 'error: .*' /tmp/build.log | sed -E "s/'[^']*'/'X'/g; s/[0-9]+/N/g" | sort | uniq -c | sort -rn | head -20
          echo "=== [4] 산출 .ko ==="
          find "$OOT_ROOT/drivers/gpu/drm" -name "*.ko" 2>/dev/null | sort
          echo "=== [5] MODPOST WARNING (Unknown symbol 포함) ==="
          grep -E "WARNING:.*undefined|Unknown symbol" /tmp/build.log || echo "(없음)"
          echo "#################################################"

      - name: "Push .ko to module-output branch"
        run: |
          DEST="thirdparty/${{ matrix.platform }}-${{ matrix.version }}-4.4.302"
          BR="module-output"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BR}" 2>/dev/null && \
            git checkout "${BR}" || \
            { git checkout --orphan "${BR}" && git rm -rf . >/dev/null 2>&1 || true; }

          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          find "$GITHUB_WORKSPACE/drivers/gpu/drm" -name "*.ko" -exec cp -f {} "${DEST}/" \;
          find "$GITHUB_WORKSPACE/drivers/char/agp" -name "*.ko" -exec cp -f {} "${DEST}/" \;
          find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.ko" -exec cp -f {} "${DEST}/" \;
          git add "${DEST}"
          git commit -m "build output ${{ matrix.platform }}-${{ matrix.version }}-4.4.302 dual-drm (i915+amdgpu) [skip ci]" || \
            echo "[skip] no changes"

          for i in $(seq 1 20); do
            git push origin "${BR}" && { echo "[PUSHED] ${BR}/${DEST} ($(ls ${DEST}/*.ko 2>/dev/null | wc -l) ko)"; break; }
            echo "[retry $i] pull --rebase..."
            sleep $((RANDOM % 8 + 2))
            git pull --rebase origin "${BR}" || true
          done

      - name: "[VERIFY] host 중복 export + Unknown symbol 점검"
        if: always()
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          SYMV="$KLIB_BUILD/Module.symvers"
          [ -f "$SYMV" ] || { echo "[WARN] host Module.symvers 없음"; exit 0; }
          awk '{print $2}' "$SYMV" | sort -u > /tmp/host_syms.txt
          echo "host export 총 $(wc -l < /tmp/host_syms.txt)개"

          total=0
          for ko in $(find "$PWD/drivers/gpu/drm" -name "*.ko" 2>/dev/null); do
            nm "$ko" 2>/dev/null | grep -oE '__ksymtab_[A-Za-z0-9_]+' | sed 's/__ksymtab_//' | sort -u > /tmp/ko_exp.txt
            dup=$(comm -12 /tmp/ko_exp.txt /tmp/host_syms.txt)
            [ -n "$dup" ] && { c=$(echo "$dup"|grep -c .); echo "  [DUP] $(basename $ko): $c 중복"; total=$((total+c)); }
          done
          echo "=== 중복 export 총계: ${total} ==="

          echo "=== .ko 별 미해결(Unknown) 심볼 점검 (host Module.symvers 대비) ==="
          for ko in $(find "$PWD/drivers/gpu/drm" -name "*.ko" 2>/dev/null); do
            nm -u "$ko" 2>/dev/null | awk '{print $2}' | sort -u > /tmp/ko_undef.txt
            missing=$(comm -23 /tmp/ko_undef.txt /tmp/host_syms.txt)
            if [ -n "$missing" ]; then
              c=$(echo "$missing" | grep -c .)
              echo "  [MISSING] $(basename $ko): $c 개"
              echo "$missing" | sed 's/^/    - /'
            fi
          done

          grep -E "WARNING:.*undefined|Unknown symbol" /tmp/build.log || echo "(MODPOST WARNING 없음)"
