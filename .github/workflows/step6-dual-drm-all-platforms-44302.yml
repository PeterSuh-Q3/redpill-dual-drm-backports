name: "[STEP6] Dual DRM 통합 빌드 (ALL platforms 4.4.302, DSM 7.2/7.3)"

# 10 플랫폼 × DSM 7.2/7.3 = 20 빌드 매트릭스
# geminilake-7.3 는 step6-dual-drm-geminilake-44302.yml 로 이미 완료.
# 이 워크플로우는 나머지 19 조합 + 재빌드가 필요한 경우 전체 수행.
# DSM 7.4 는 별도 워크플로우(step6-dual-drm-all-platforms-dsm74-44302.yml)로 분리 관리
# — 7.4에서만 Unknown symbol 이슈가 발생해 compat/shim 조정이 7.2/7.3과 달라질 수 있음.
#
# ★ 2026-08-17: module-output 브랜치 push 를 build 잡 20개가 동시에 직접 하던
# 구조(fetch→checkout→commit→push 경합)에서 실제 데이터 유실 발생(동시 push race로
# 이미 존재하던 broadwellnk-7.3 등 다수 디렉토리가 사라짐). build 잡은 산출물을
# artifact 로만 올리고, 별도 단일 push 잡이 전부 모아 한 번만 커밋하도록 재설계.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "빌드할 플랫폼 목록 (공백 구분, 빈값=전체)"
        required: false
        default: ""
      versions:
        description: "DSM 버전 목록 (공백 구분, 빈값=7.2 7.3 전체)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.2", platform: geminilake }
          - { version: "7.3", platform: geminilake }
          - { version: "7.2", platform: apollolake }
          - { version: "7.3", platform: apollolake }
          - { version: "7.2", platform: broadwellnk }
          - { version: "7.3", platform: broadwellnk }
          - { version: "7.2", platform: broadwell }
          - { version: "7.3", platform: broadwell }
          - { version: "7.2", platform: broadwellnkv2 }
          - { version: "7.3", platform: broadwellnkv2 }
          - { version: "7.2", platform: broadwellntbap }
          - { version: "7.3", platform: broadwellntbap }
          - { version: "7.2", platform: denverton }
          - { version: "7.3", platform: denverton }
          - { version: "7.2", platform: purley }
          - { version: "7.3", platform: purley }
          - { version: "7.2", platform: r1000 }
          - { version: "7.3", platform: r1000 }
          - { version: "7.2", platform: v1000 }
          - { version: "7.3", platform: v1000 }

    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Cache toolkit tarballs
        uses: actions/cache@v4
        with:
          path: |
            ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
            ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          key: toolkit-${{ matrix.platform }}-${{ matrix.version }}

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          if [ -f "$env_tarball" ]; then echo "[cache] $env_tarball"; else
            echo "[download] $env_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          fi
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          if [ -f "$dev_tarball" ]; then echo "[cache] $dev_tarball"; else
            echo "[download] $dev_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          fi
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      - name: "Build (Dual DRM: i915 + amdgpu)"
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KBUILD_MODPOST_WARN=1
          export OOT_ROOT=$PWD

          echo "=== [${{ matrix.platform }}-${{ matrix.version }}] host KLIB DRM .config ==="
          grep -E '^CONFIG_(DRM|I915|AMDGPU|TTM|DRM_SCHED)' "$KLIB_BUILD/.config" 2>/dev/null || echo "(없음)"

          export OOT_KCPPFLAGS="\
            -I$OOT_ROOT/compat/backport-include \
            -I$OOT_ROOT/include \
            -I$OOT_ROOT/include/uapi \
            -I$OOT_ROOT/compat \
            -include $OOT_ROOT/compat/drm_compat.h \
            -include $OOT_ROOT/compat/kcl_compat.h \
            -DCONFIG_FB_DEFERRED_IO -DCONFIG_FB_NOTIFY"

          # geminilake/apollolake host 는 hdmi/drm_mipi_dsi/sync_file/interval_tree/
          # intel_gtt 가 이미 빌트인(실기 /proc/kallsyms 확인) — 우리가 또 만들면
          # "invalid module format"(심볼 중복)으로 insmod 자체가 실패.
          # IN_KERNEL 가드로 스킵(host 위임), intel-gtt(AGP_INTEL)/drm_mipi_dsi 는
          # 이 두 플랫폼에서 아예 빌드 안 함(NOHOST_CONFIG 는 host 미제공 8플랫폼 전용).
          EXTRA_CONFIG=""
          NOHOST_CONFIG="CONFIG_AGP_INTEL=m CONFIG_DRM_MIPI_DSI=m"
          case "${{ matrix.platform }}" in
            geminilake|apollolake)
              EXTRA_CONFIG="CONFIG_DRM_SYNC_FILE_IN_KERNEL=y CONFIG_INTERVAL_TREE_IN_KERNEL=y CONFIG_DRM_HDMI_IN_KERNEL=y CONFIG_FB_NOTIFY_IN_KERNEL=y"
              NOHOST_CONFIG=""
              OOT_KCPPFLAGS="$OOT_KCPPFLAGS -DCONFIG_DRM_HDMI_IN_KERNEL"
              ;;
          esac

          make -C "$KLIB_BUILD" M="$OOT_ROOT" \
            CONFIG_DRM=m CONFIG_DRM_KMS_HELPER=m \
            CONFIG_DRM_I915=m CONFIG_DRM_I915_USERPTR=y \
            CONFIG_DRM_TTM=m CONFIG_DRM_SCHED=m \
            CONFIG_DRM_AMDGPU=m \
            $NOHOST_CONFIG \
            CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=m \
            $EXTRA_CONFIG \
            KCPPFLAGS="$OOT_KCPPFLAGS" \
            modules 2>&1 | tee /tmp/build.log || true

          # 디버그 심볼 제거
          find "$OOT_ROOT" -name "*.ko" | while read ko; do
            ${CROSS_COMPILE}strip --strip-debug "$ko"
          done

          echo ""
          echo "################ 빌드 결과 요약 [${{ matrix.platform }}-${{ matrix.version }}] ################"
          echo "=== [1] 에러 총수 ==="
          grep -cE ': error:' /tmp/build.log || echo 0
          echo "=== [2] 에러난 소스 파일별 건수 ==="
          grep -oE '[a-zA-Z0-9_/.-]+\.[ch]:[0-9]+: error' /tmp/build.log | sed -E 's/:[0-9]+: error//' | sort | uniq -c | sort -rn | head -30
          echo "=== [3] 에러 메시지 유형별 ==="
          grep -oE 'error: .*' /tmp/build.log | sed -E "s/'[^']*'/'X'/g; s/[0-9]+/N/g" | sort | uniq -c | sort -rn | head -20
          echo "=== [4] 산출 .ko ==="
          find "$OOT_ROOT/drivers/gpu/drm" -name "*.ko" 2>/dev/null | sort
          echo "=== [5] MODPOST WARNING ==="
          grep "WARNING:.*undefined" /tmp/build.log || echo "(없음)"
          echo "#################################################"

      - name: "Stage .ko for artifact upload"
        run: |
          mkdir -p artifact-out
          find "$GITHUB_WORKSPACE/drivers/gpu/drm" -name "*.ko" -exec cp -f {} artifact-out/ \;
          find "$GITHUB_WORKSPACE/drivers/char/agp" -name "*.ko" -exec cp -f {} artifact-out/ \;
          find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.ko" -exec cp -f {} artifact-out/ \;
          echo "=== artifact-out 내용 ==="
          ls -la artifact-out/

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.platform }}-${{ matrix.version }}
          path: artifact-out/*.ko
          if-no-files-found: error
          retention-days: 1

      - name: "[VERIFY] host 중복 export 점검"
        if: always()
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          SYMV="$KLIB_BUILD/Module.symvers"
          [ -f "$SYMV" ] || { echo "[WARN] host Module.symvers 없음"; exit 0; }
          awk '{print $2}' "$SYMV" | sort -u > /tmp/host_syms.txt
          echo "host export 총 $(wc -l < /tmp/host_syms.txt)개"
          total=0
          for ko in $(find "$PWD/drivers/gpu/drm" -name "*.ko" 2>/dev/null); do
            nm "$ko" 2>/dev/null | grep -oE '__ksymtab_[A-Za-z0-9_]+' | sed 's/__ksymtab_//' | sort -u > /tmp/ko_exp.txt
            dup=$(comm -12 /tmp/ko_exp.txt /tmp/host_syms.txt)
            [ -n "$dup" ] && { c=$(echo "$dup"|grep -c .); echo "  [DUP] $(basename $ko): $c 중복"; total=$((total+c)); }
          done
          echo "=== 중복 export 총계: ${total} ==="
          grep "WARNING:.*undefined" /tmp/build.log || echo "(MODPOST WARNING 없음)"

  push:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module-output branch
        uses: actions/checkout@v4
        with:
          ref: module-output
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: modules-*

      - name: "Merge into thirdparty/ and commit (single writer, no race)"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          total=0
          for d in downloaded/modules-*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            # modules-<platform>-<version> → platform, version 분리
            rest="${name#modules-}"
            version="${rest##*-}"
            platform="${rest%-*}"
            DEST="thirdparty/${platform}-${version}-4.4.302"

            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp -f "$d"*.ko "$DEST/" 2>/dev/null || true
            n=$(ls "$DEST"/*.ko 2>/dev/null | wc -l)
            echo "[${DEST}] ${n}개"
            total=$((total+n))
            git add "$DEST"
          done
          echo "총 ${total}개 .ko 반영"

          git commit -m "build output all-platforms-44302 dual-drm (i915+amdgpu) [skip ci]" || \
            echo "[skip] no changes"
          git push origin module-output
