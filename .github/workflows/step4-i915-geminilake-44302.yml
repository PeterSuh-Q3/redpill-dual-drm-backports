name: "[STEP4] i915 단독 빌드 (geminilake 4.4.302)"

# 설계서 §10 Step4. integration/dual-drm(vendor v5.4 + 레시피) 의 i915 를
# Synology geminilake 4.4.302 KLIB 대상으로 OOT 빌드.
# 5.10.55 파일럿 워크플로우(dual-gpu-backports) 구조를 미러링.
#   차이: 5.10.55=make defconfig-drm(i915-backports CPTCFG) → redpill=plain CONFIG 주입.
# i915 단독: CONFIG_DRM/KMS_HELPER/I915=m, amdgpu/ttm/sched off.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "7.3", platform: geminilake }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (integration/dual-drm)
        uses: actions/checkout@v4
        with:
          ref: integration/dual-drm
          fetch-depth: 1

      - name: Cache toolkit tarballs
        uses: actions/cache@v4
        with:
          path: |
            ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
            ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          key: toolkit-${{ matrix.platform }}-${{ matrix.version }}

      - name: Download toolchain
        run: |
          env_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.env.txz
          if [ -f "$env_tarball" ]; then echo "[cache] $env_tarball"; else
            echo "[download] $env_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$env_tarball
          fi
          mkdir toolchain
          tar xf $env_tarball -C toolchain

      - name: Download kernel source
        run: |
          dev_tarball=ds.${{ matrix.platform }}-${{ matrix.version }}.dev.txz
          if [ -f "$dev_tarball" ]; then echo "[cache] $dev_tarball"; else
            echo "[download] $dev_tarball"
            wget -q https://global.synologydownload.com/download/ToolChain/toolkit/${{ matrix.version }}/${{ matrix.platform }}/$dev_tarball
          fi
          mkdir ksrc
          tar xf $dev_tarball -C ksrc

      - name: "Build (전수 인벤토리: keep-going, -Wno-error)"
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          export KBUILD_MODPOST_WARN=1
          # 헤더 경로는 Makefile 의 LINUXINCLUDE(backport-include→vendor include→compat)가 처리.
          # force-include(drm_compat.h) 제거 — drmP.h cascade 유발했었음.

          echo "=== host KLIB DRM/I915 .config ==="
          grep -E '^CONFIG_DRM(_I915)?[ =]' "$KLIB_BUILD/.config" 2>/dev/null || echo "(없음)"

          # ★ 전수 인벤토리: -k(keep-going) 로 모든 파일 끝까지 컴파일,
          #   KCFLAGS=-Wno-error 로 -Werror 조기중단 방지 → 전체 gap 을 1회에 수집.
          make -k -C "$KLIB_BUILD" M=$PWD \
            CONFIG_DRM=m CONFIG_DRM_KMS_HELPER=m CONFIG_DRM_I915=m CONFIG_DRM_I915_USERPTR=y \
            KCFLAGS="-Wno-error" \
            modules 2>&1 | tee /tmp/build.log || true

          echo ""
          echo "################ 전수 에러 인벤토리 ################"
          echo "=== [1] 에러 총수 ==="
          grep -cE ': error:' /tmp/build.log || echo 0
          echo "=== [2] 에러난 소스 파일별 건수 ==="
          grep -oE '[a-zA-Z0-9_/.-]+\.[ch]:[0-9]+: error' /tmp/build.log | sed -E 's/:[0-9]+: error//' | sort | uniq -c | sort -rn | head -40
          echo "=== [3] 에러 메시지 유형별(식별자 마스킹) ==="
          grep -oE 'error: .*' /tmp/build.log | sed -E "s/'[^']*'/'X'/g; s/[0-9]+/N/g" | sort | uniq -c | sort -rn | head -30
          echo "=== [4] undeclared/no member/implicit 식별자 고유 목록 ==="
          grep -oE "'[A-Za-z_][A-Za-z0-9_]*' (undeclared|undeclared here|has no member named|implicit declaration)" /tmp/build.log \
            | sort -u | head -120
          echo "=== [5] 'has no member named X' (구조체 멤버 gap) ==="
          grep -oE "has no member named '[A-Za-z0-9_]*'" /tmp/build.log | sort | uniq -c | sort -rn | head -40
          echo "###################################################"

      - name: "[VERIFY] host 중복 export 점검"
        if: always()
        run: |
          export KLIB_BUILD=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ matrix.version }}/build
          SYMV="$KLIB_BUILD/Module.symvers"
          [ -f "$SYMV" ] || { echo "[WARN] host Module.symvers 없음"; exit 0; }
          awk '{print $2}' "$SYMV" | sort -u > /tmp/host_syms.txt
          echo "host export 총 $(wc -l < /tmp/host_syms.txt)개 / drm_ $(grep -c '^drm_' /tmp/host_syms.txt) / i915·intel_ $(grep -cE '^(i915_|intel_)' /tmp/host_syms.txt)"
          total=0
          for ko in out/modules/*.ko; do
            [ -f "$ko" ] || continue
            nm "$ko" 2>/dev/null | grep -oE '__ksymtab_[A-Za-z0-9_]+' | sed 's/__ksymtab_//' | sort -u > /tmp/ko_exp.txt
            dup=$(comm -12 /tmp/ko_exp.txt /tmp/host_syms.txt)
            [ -n "$dup" ] && { c=$(echo "$dup"|grep -c .); echo "  [DUP] $(basename $ko): $c"; total=$((total+c)); }
          done
          echo "=== 중복 export 총계: ${total} ==="
