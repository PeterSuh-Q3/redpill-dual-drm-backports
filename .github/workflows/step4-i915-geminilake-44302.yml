name: "[STEP4] i915 단독 빌드 진단 (geminilake 4.4.302)"

# 설계서 §10 Step4. integration/dual-drm(vendor v5.4 + 레시피) 의 i915 를
# Synology geminilake 4.4.302 KLIB 대상으로 OOT 빌드 시도.
#
# ★ 첫 런 목적 = 진단:
#   (1) host 커널의 drm/i915 내장 여부 + Module.symvers 중복 심볼 지형
#       → plain-CONFIG 로 충분한지 vs CPTCFG-rename 필요한지 판단 근거
#   (2) compat shim(KCPPFLAGS) 주입 하 i915 컴파일 에러 1차 표면
# 빌드 성공을 가정하지 않음. 로그가 산출물.

on:
  workflow_dispatch:
    inputs:
      dsm:
        description: "DSM toolkit 버전 (geminilake 4.4.302)"
        default: "7.2"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  step4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration/dual-drm (vendor + 레시피)
        uses: actions/checkout@v4
        with:
          ref: integration/dual-drm
          fetch-depth: 1

      - name: Cache toolkit
        uses: actions/cache@v4
        with:
          path: |
            ds.geminilake-${{ inputs.dsm }}.env.txz
            ds.geminilake-${{ inputs.dsm }}.dev.txz
          key: toolkit-geminilake-${{ inputs.dsm }}

      - name: Download toolchain + kernel
        run: |
          base=https://global.synologydownload.com/download/ToolChain/toolkit/${{ inputs.dsm }}/geminilake
          for t in env dev; do
            f=ds.geminilake-${{ inputs.dsm }}.$t.txz
            [ -f "$f" ] || wget -q "$base/$f"
          done
          mkdir toolchain ksrc
          tar xf ds.geminilake-${{ inputs.dsm }}.env.txz -C toolchain
          tar xf ds.geminilake-${{ inputs.dsm }}.dev.txz -C ksrc

      - name: "[DIAG] host drm/i915 심볼 지형"
        run: |
          KLIB=$PWD/ksrc/usr/local/x86_64-pc-linux-gnu/x86_64-pc-linux-gnu/sys-root/usr/lib/modules/DSM-${{ inputs.dsm }}/build
          echo "KLIB=$KLIB"
          echo "=== KLIB .config DRM/I915 ==="
          grep -E '^CONFIG_DRM(_I915)?[ =]' "$KLIB/.config" 2>/dev/null || echo "(.config DRM 항목 없음)"
          echo "=== host Module.symvers: drm/i915 export 수 ==="
          SYMV="$KLIB/Module.symvers"
          if [ -f "$SYMV" ]; then
            echo "  drm_*  : $(awk '{print $2}' "$SYMV" | grep -c '^drm_')"
            echo "  i915 관련(intel_/i915_): $(awk '{print $2}' "$SYMV" | grep -cE '^(i915_|intel_)')"
            echo "  dma_fence_/dma_resv: $(awk '{print $2}' "$SYMV" | grep -cE '^dma_(fence|resv)')"
            echo "  reservation_object : $(awk '{print $2}' "$SYMV" | grep -c '^reservation_object')"
            echo "  --- 샘플 drm_ export 10개 ---"
            awk '{print $2}' "$SYMV" | grep '^drm_' | head -10 | sed 's/^/    /'
          else
            echo "  [!] Module.symvers 없음 → 충돌 분석 불가"
          fi
          echo "=== host 가 i915.ko 를 빌드하는가(빌트인 vs 모듈) ==="
          grep -E '^CONFIG_DRM_I915=' "$KLIB/.config" 2>/dev/null
          echo "KLIB=$KLIB" >> "$GITHUB_ENV"

      - name: "[STEP4] i915 단독 빌드 시도 (probe)"
        continue-on-error: true
        run: |
          export CROSS_COMPILE=$PWD/toolchain/usr/local/x86_64-pc-linux-gnu/bin/x86_64-pc-linux-gnu-
          COMPAT="-I$PWD/compat -I$PWD/include -include $PWD/compat/drm_compat.h -include $PWD/compat/i915_compat.h"
          echo "=== i915 단독: CONFIG_DRM/KMS_HELPER/I915=m, amdgpu/ttm/sched off ==="
          set +e
          make -C "$KLIB" M=$PWD \
            CONFIG_DRM=m CONFIG_DRM_KMS_HELPER=m CONFIG_DRM_I915=m CONFIG_DRM_I915_USERPTR=y \
            KCPPFLAGS="$COMPAT" KBUILD_MODPOST_WARN=1 \
            modules 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "=== build rc=$rc ==="
          echo "=== 에러/경고 상위 40 (error|undefined|redefin|conflict) ==="
          grep -nE 'error:|undefined|redefinition|conflicting|No such file' /tmp/build.log | head -40
          echo "=== 산출 .ko (있으면) ==="
          find $PWD -name '*.ko' 2>/dev/null | sed 's#'$PWD'/##' | head
          exit 0
