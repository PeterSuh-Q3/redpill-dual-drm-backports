name: "[COPY] thirdparty → mshell-modules/thirdparty"

# redpill-dual-drm-backports/thirdparty/ 의 .ko 를
# mshell-modules/thirdparty/ 로 복사.
#
# ★ 2026-08-17: apollolake/geminilake의 intel-gtt.ko/interval_tree.ko
# (커널 빌트인이라 중복 export 충돌) 제외 로직을 여기서 걷어냄 —
# 이제 빌드 단계(redpill CI, CONFIG_INTERVAL_TREE_IN_KERNEL 가드 등)에서
# 해당 플랫폼은 애초에 이 .ko 를 생산하지 않으므로 복사할 대상 자체가 없음.
# (판단 로직은 build-time 으로 이전, 여기는 단순 복사만 수행)

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redpill-dual-drm-backports (source, module-output branch)
        uses: actions/checkout@v4
        with:
          ref: module-output
          path: src
          fetch-depth: 1

      - name: Checkout mshell-modules (target)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/mshell-modules
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: dst
          fetch-depth: 1

      - name: Copy .ko files
        run: |
          total=0
          for src_dir in src/thirdparty/*/; do
            entry=$(basename "$src_dir")
            [[ "$entry" == *"-4.4.302" ]] || continue

            dst_dir="dst/thirdparty/${entry}"
            mkdir -p "$dst_dir"

            copied=0
            for ko in "$src_dir"*.ko; do
              [ -f "$ko" ] || continue
              cp -f "$ko" "$dst_dir/"
              copied=$((copied+1))
            done
            echo "[${entry}] ${copied}개 복사"
            total=$((total+copied))
          done
          echo ""
          echo "총 ${total}개 .ko 복사 완료"

      - name: Commit and push to mshell-modules
        run: |
          cd dst
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add thirdparty/
          git commit -m "chore: redpill-dual-drm-backports 4.4.302 .ko 동기화 [skip ci]" || \
            echo "[skip] 변경사항 없음"

          for i in $(seq 1 5); do
            git push && break
            echo "[retry $i]"
            sleep 3
            git pull --rebase && git push && break
          done
